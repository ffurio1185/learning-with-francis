# Free public demonstration only. Deployment still requires owner approval.
services:
  - type: web
    name: learning-with-francis
    runtime: python
    repo: https://github.com/ffurio1185/learning-with-francis
    branch: main
    plan: free
    region: frankfurt
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: sh render-start.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.4
      - key: LWF_DATA_DIR
        value: /tmp/learning-with-francis
      - key: LWF_DEMO_MODE
        value: "1"
      - key: LWF_SECRET_KEY
        generateValue: true
